spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rowzero}
spring.datasource.username=${DB_USERNAME:rowzero}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.issuer=${JWT_ISSUER:rowzero}
app.security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

app.festival.time-zone=${FESTIVAL_TIME_ZONE:Europe/Warsaw}

app.tmdb.base-url=https://api.themoviedb.org/3
app.tmdb.read-token=${TMDB_READ_TOKEN:}
app.tmdb.language=${TMDB_LANGUAGE:en-US}

app.reservation.expiration-check-ms=${RESERVATION_EXPIRATION_CHECK_MS:15000}